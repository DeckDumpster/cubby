[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
opentelemetry-proto = { version = "0.30", default-features = false, features = ["metrics", "gen-tonic-messages"] }
prost = { version = "0.13", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ulid = { version = "3", default-features = false, features = ["std"] }
tempfile = "3"
sha2 = "0.10"
getrandom = "0.3"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
proptest = { version = "1", default-features = false, features = ["std"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
