# Declares deploy/ci.sh to testenv, so `testenv --suites ci <branch> cubby` runs the gate.
# The image is the rust toolchain the workspace pins; ci.sh fetches node itself when absent.
image = "docker.io/library/rust:1.99.1-bookworm"
workdir = "/work"
timeout = 1800
# ci_entry is the command a queue.local round runs on a round VM (read by the
# harness's gate::own::ci_entry): the whole of CI, which is what ci.yml gates on.
ci_entry = "bash deploy/ci.sh"
default = ["ci"]

[tier.ci]
argv = ["bash", "deploy/ci.sh"]
timeout = 1800

[ui]
dir = "web"

[tier.e2e]
argv = ["bash", "deploy/e2e.sh"]
timeout = 1800
